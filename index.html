<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyloom</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Storyloom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12111a" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Frank+Ruhl+Libre:wght@400;600;700&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12111a; --bg2:#191826; --panel:#201f30; --panel2:#282740;
    --ink:#eceaf6; --ink-dim:#9b97b8; --ink-faint:#6a668a;
    --accent:#f0a35e; --accent2:#b48cf2; --accent3:#6fd3c7;
    --danger:#e07070;
    --line:#33314e; --radius:14px;
    --chip-on-ink:#160f24; --count-ink:#1b1408;
    --st-inbox:#f0a35e; --st-inbox-bg:rgba(240,163,94,.13);
    --st-sorted:#b48cf2; --st-sorted-bg:rgba(180,140,242,.13);
    --st-seq:#6fd3c7;    --st-seq-bg:rgba(111,211,199,.12);
    --tag-ink:#6fd3c7; --tag-bg:#1d3230; --world-ink:#f0a35e; --world-bg:#3a2a17;
    --k-spark-bg:#4a3520;--k-spark-ink:#f2b571; --k-dialogue-bg:#2c4139;--k-dialogue-ink:#8fe0c9;
    --k-scene-bg:#3c2c4e;--k-scene-ink:#c9a6f5; --k-character-bg:#452831;--k-character-ink:#f0a0b8;
    --k-place-bg:#233c4c;--k-place-ink:#84c5ec; --k-idea-bg:#414024;--k-idea-ink:#e3df84;
    --k-ref-bg:#333346;--k-ref-ink:#a9a9cf;
    --hero-shade-a:rgba(14,12,24,.55); --hero-shade-b:rgba(14,12,24,.88);
    --cover-shade:rgba(10,8,18,.85);
    --font-ui:'Inter','Assistant',system-ui,sans-serif; --font-display:'Fraunces','Frank Ruhl Libre',Georgia,serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2f1f7; --bg2:#ffffff; --panel:#ffffff; --panel2:#eae8f3;
      --ink:#272338; --ink-dim:#5d5878; --ink-faint:#8c88a5;
      --accent:#c1731f; --accent2:#7d55c7; --accent3:#1f8d80;
      --danger:#c05252; --line:#d9d6e6;
      --chip-on-ink:#ffffff; --count-ink:#ffffff;
      --hero-shade-a:rgba(246,245,250,.62); --hero-shade-b:rgba(246,245,250,.92);
      --cover-shade:rgba(246,245,250,.9);
      --st-inbox:#a05c15; --st-inbox-bg:rgba(160,92,21,.10);
      --st-sorted:#7d55c7; --st-sorted-bg:rgba(125,85,199,.10);
      --st-seq:#17756a;    --st-seq-bg:rgba(23,117,106,.10);
      --tag-ink:#17756a; --tag-bg:#dbefec; --world-ink:#8d5312; --world-bg:#f7e7d4;
      --k-spark-bg:#fbeada;--k-spark-ink:#8a5312; --k-dialogue-bg:#d9f0e8;--k-dialogue-ink:#16665a;
      --k-scene-bg:#ece0f8;--k-scene-ink:#65399f; --k-character-bg:#fadfe6;--k-character-ink:#9e3c59;
      --k-place-bg:#d9ecf8;--k-place-ink:#1c5c80; --k-idea-bg:#f0eed0;--k-idea-ink:#66611a;
      --k-ref-bg:#e6e6f0;--k-ref-ink:#4b4b70;
    }
  }
  :root[data-theme="light"]{
    --bg:#f2f1f7; --bg2:#ffffff; --panel:#ffffff; --panel2:#eae8f3;
    --ink:#272338; --ink-dim:#5d5878; --ink-faint:#8c88a5;
    --accent:#c1731f; --accent2:#7d55c7; --accent3:#1f8d80;
    --danger:#c05252; --line:#d9d6e6;
    --chip-on-ink:#ffffff; --count-ink:#ffffff;
    --hero-shade-a:rgba(246,245,250,.62); --hero-shade-b:rgba(246,245,250,.92);
    --cover-shade:rgba(246,245,250,.9);
    --st-inbox:#a05c15; --st-inbox-bg:rgba(160,92,21,.10);
    --st-sorted:#7d55c7; --st-sorted-bg:rgba(125,85,199,.10);
    --st-seq:#17756a;    --st-seq-bg:rgba(23,117,106,.10);
    --tag-ink:#17756a; --tag-bg:#dbefec; --world-ink:#8d5312; --world-bg:#f7e7d4;
    --k-spark-bg:#fbeada;--k-spark-ink:#8a5312; --k-dialogue-bg:#d9f0e8;--k-dialogue-ink:#16665a;
    --k-scene-bg:#ece0f8;--k-scene-ink:#65399f; --k-character-bg:#fadfe6;--k-character-ink:#9e3c59;
    --k-place-bg:#d9ecf8;--k-place-ink:#1c5c80; --k-idea-bg:#f0eed0;--k-idea-ink:#66611a;
    --k-ref-bg:#e6e6f0;--k-ref-ink:#4b4b70;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
  ::placeholder{color:var(--ink-faint)}

  header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:50}
  .logo{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  nav{display:flex;gap:4px;flex:1}
  nav button{padding:8px 14px;border-radius:9px;color:var(--ink-dim);font-weight:500;font-size:14px}
  nav button:hover{background:var(--panel)}
  nav button.active{background:var(--panel2);color:var(--ink)}
  nav button .count{font-size:11px;background:var(--accent);color:var(--count-ink);border-radius:10px;padding:1px 7px;margin-inline-start:6px;font-weight:600}
  .hdr-actions{display:flex;gap:8px}
  .btn{padding:8px 14px;border-radius:9px;font-weight:500;font-size:14px;background:var(--panel);border:1px solid var(--line)}
  .btn:hover{background:var(--panel2)}
  .btn.primary{background:linear-gradient(90deg,#e2903f,#c98936);color:#221503;border:none;font-weight:600}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.ghost{border:none;background:none;color:var(--ink-dim)}
  .btn.ghost:hover{color:var(--ink)}
  .btn.danger{color:var(--danger);border-color:#5a3040}

  main{max-width:1100px;margin:0 auto;padding:26px 22px 90px}

  /* capture */
  .capture{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:26px}
  .capture textarea{width:100%;min-height:74px;resize:vertical;background:var(--bg2);font-size:16px}
  .capture-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .capture-row input,.capture-row select{flex:1;min-width:120px}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:8px}

  /* filter bar */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
  .filters input[type=search]{flex:2;min-width:180px}
  .filters select{min-width:130px}
  .chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--panel2);color:var(--ink-dim);border:1px solid var(--line);cursor:pointer;user-select:none}
  .chip{display:inline-flex;align-items:center;gap:2px;padding-block:3px;padding-inline:10px 6px}
  .chip.on{background:var(--accent2);color:var(--chip-on-ink);border-color:var(--accent2);font-weight:600}
  .chip-star{font-size:12px;line-height:1;padding:2px 3px;border-radius:5px;color:var(--ink-faint);background:none;border:none;cursor:pointer}
  .chip-star:hover{color:var(--accent)}
  .chip-star.on{color:var(--accent)}
  .chip.on .chip-star{color:var(--chip-on-ink)}

  .tag-tree{display:flex;flex-direction:column;gap:6px}
  .tag-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-inline-start:4px solid var(--accent);border-radius:10px;padding:11px 14px;cursor:pointer;
    transition:transform .1s,border-color .15s}
  .tag-row:hover{transform:translateY(-1px);border-color:var(--accent)}
  .tag-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .tag-name{font-family:var(--font-display);font-size:17px;font-weight:600}
  .tag-hash{font-size:12px;color:var(--accent)}
  .tag-stats{margin-inline-start:auto;font-size:12px;color:var(--ink-faint);white-space:nowrap}
  .tag-crumb{font-size:12.5px;color:var(--ink-dim);margin-bottom:6px}
  .tag-crumb span{cursor:pointer;color:var(--accent3)}
  .tag-crumb span:hover{text-decoration:underline}
  .warp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .warp-card{background:var(--panel);border:1.5px solid var(--line);border-inline-start:5px solid var(--accent);
    border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .1s,box-shadow .15s}
  .warp-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.28)}
  .warp-cover{height:104px;background-size:cover;background-position:center}
  .warp-body{padding:14px 16px}
  .warp-title{font-family:var(--font-display);font-size:20px;font-weight:600}
  .warp-tag{font-size:12px;color:var(--accent);margin-top:2px}
  .warp-desc{font-size:13.5px;color:var(--ink-dim);margin-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .warp-meta{font-size:12px;color:var(--ink-faint);margin-top:10px}

  /* note cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{position:relative;overflow:hidden;background-color:var(--panel);
    background-image:linear-gradient(var(--stbg,transparent),var(--stbg,transparent));
    border:1.5px solid var(--st,var(--line));border-radius:var(--radius);
    padding:19px 14px 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
    transition:transform .1s, box-shadow .15s}
  .card::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--st,var(--line));z-index:2}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.28)}
  .card.st-inbox{--st:var(--st-inbox);--stbg:var(--st-inbox-bg)}
  .card.st-sorted{--st:var(--st-sorted);--stbg:var(--st-sorted-bg)}
  .card.st-seq{--st:var(--st-seq);--stbg:var(--st-seq-bg)}
  .st-chip{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
    padding:3px 9px;border-radius:6px;background:var(--st);color:var(--chip-on-ink);white-space:nowrap}
  .card-img{width:calc(100% + 28px);margin:-19px -14px 0;border-radius:0;max-height:150px;object-fit:cover}
  .legend{display:flex;gap:10px;font-size:12.5px;color:var(--ink-dim);margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .legend span.lg{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--st);
    background-image:linear-gradient(var(--stbg),var(--stbg));border-radius:9px;padding-block:4px;padding-inline:4px 11px}
  .legend .lg-inbox{--st:var(--st-inbox);--stbg:var(--st-inbox-bg)}
  .legend .lg-sorted{--st:var(--st-sorted);--stbg:var(--st-sorted-bg)}
  .legend .lg-seq{--st:var(--st-seq);--stbg:var(--st-seq-bg)}
  .ldot{width:16px;height:16px;border-radius:5px;display:inline-block;background:var(--st)}
  .beat-img{display:block;max-width:180px;max-height:110px;border-radius:8px;margin:6px 0}
  .cap-preview{display:inline-flex;align-items:center;gap:6px}
  .cap-preview img{height:44px;border-radius:6px;display:block}
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .kind{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;padding:2px 8px;border-radius:6px}
  .kind-spark{background:var(--k-spark-bg);color:var(--k-spark-ink)}
  .kind-dialogue{background:var(--k-dialogue-bg);color:var(--k-dialogue-ink)}
  .kind-scene{background:var(--k-scene-bg);color:var(--k-scene-ink)}
  .kind-character{background:var(--k-character-bg);color:var(--k-character-ink)}
  .kind-place{background:var(--k-place-bg);color:var(--k-place-ink)}
  .kind-idea{background:var(--k-idea-bg);color:var(--k-idea-ink)}
  .kind-ref{background:var(--k-ref-bg);color:var(--k-ref-ink)}
  .card-text{white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;font-size:14.5px}
  .card-text.dlg{font-family:var(--font-display);font-style:italic}
  /* Hebrew has no true italic — a slanted fake reads as a rendering bug */
  .card-text.dlg:dir(rtl),.beat-text.dlg:dir(rtl){font-style:normal;font-weight:600}
  /* let each field sit on its own side without flipping the whole app */
  [dir=auto]{text-align:start}
  textarea[dir=auto],input[dir=auto]{text-align:start}
  .card-text:dir(rtl),.beat-text:dir(rtl){line-height:1.65}
  .card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-faint);margin-top:auto}
  .tag{font-size:11.5px;color:var(--tag-ink);background:var(--tag-bg);padding:2px 8px;border-radius:12px}
  .world-pill{font-size:11.5px;color:var(--world-ink);background:var(--world-bg);padding:2px 8px;border-radius:12px}
  .in-seq{font-size:11px;color:var(--accent2)}

  /* sequences */
  .seq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .seq-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--panel);transition:border-color .15s}
  .seq-card:hover{border-color:var(--accent)}
  .seq-cover{height:110px;background-size:cover;background-position:center;background-color:var(--panel2);display:flex;align-items:flex-end}
  .seq-cover-shade{width:100%;padding:10px 14px;background:linear-gradient(transparent,var(--cover-shade))}
  .seq-title{font-family:var(--font-display);font-size:19px;font-weight:600}
  .seq-body{padding:10px 14px;color:var(--ink-dim);font-size:13.5px;display:flex;justify-content:space-between;gap:8px}

  /* sequence detail */
  .seq-hero{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);margin-bottom:20px;background-size:cover;background-position:center;background-color:var(--panel)}
  .seq-hero-inner{background:linear-gradient(var(--hero-shade-a),var(--hero-shade-b));padding:24px}
  .seq-hero input.title{font-family:var(--font-display);font-size:26px;font-weight:700;background:transparent;border:none;width:100%;padding:0}
  .seq-hero textarea{width:100%;background:var(--panel2);margin-top:10px;min-height:44px;resize:vertical}
  .seq-hero-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .seq-hero-row input{flex:1;min-width:200px;background:var(--panel2)}

  .beats{position:relative;padding-inline-start:34px}
  .beats::before{content:'';position:absolute;inset-inline-start:11px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--accent2))}
  .beat{position:relative;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
  .beat::before{content:'';position:absolute;inset-inline-start:-29px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
  .beat.dragover{border-color:var(--accent3)}
  .beat-main{flex:1;min-width:0}
  .beat-text{white-space:pre-wrap;font-size:14.5px;cursor:pointer}
  .beat-text:hover{color:var(--accent3)}
  .beat-time{width:130px}
  .beat-time input{width:100%;font-size:12.5px;background:var(--bg2)}
  .beat-ctl{display:flex;flex-direction:column;gap:2px}
  .beat-ctl button{color:var(--ink-faint);font-size:13px;padding:1px 6px;border-radius:5px}
  .beat-ctl button:hover{color:var(--ink);background:var(--panel2)}
  .drag-handle{cursor:grab;color:var(--ink-faint);padding-top:2px;font-size:15px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(8,6,16,.72);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow:auto}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:640px;padding:22px}
  .modal h3{font-family:var(--font-display);margin-bottom:14px;font-size:20px}
  .frow{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .frow>*{flex:1;min-width:130px}
  .flabel{font-size:12px;color:var(--ink-dim);margin-bottom:3px;display:block}
  .modal textarea{width:100%;min-height:110px;resize:vertical;font-size:15px}
  .modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
  .links-list{margin-top:6px;display:flex;flex-direction:column;gap:6px}
  .link-row{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px}
  .link-row .lbl{color:var(--accent2);font-size:12px;white-space:nowrap}
  .link-row .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .link-row .txt:hover{color:var(--accent3)}
  .refs-list a{color:var(--accent3);font-size:13px;word-break:break-all}

  /* picker */
  .picker{max-height:320px;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .pick-row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
  .pick-row:hover{border-color:var(--accent)}

  .empty{color:var(--ink-faint);text-align:center;padding:50px 20px;font-size:15px}
  .empty b{color:var(--ink-dim)}
  .section-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .section-h h2{font-family:var(--font-display);font-size:22px;font-weight:600}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent2);padding:10px 20px;border-radius:10px;z-index:200;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:700px){ header{flex-wrap:wrap} nav{order:3;width:100%;overflow-x:auto} .beat{flex-wrap:wrap} .beat-time{width:100%} }
</style>
</head>
<body>
<header>
  <div class="logo">✦ Storyloom</div>
  <nav id="nav"></nav>
  <div class="hdr-actions">
    <span id="storeBadge" style="align-self:center;font-size:11.5px;color:var(--ink-faint);white-space:nowrap"></span>
    <button class="btn ghost" id="langBtn" onclick="toggleLang()" style="font-weight:600;padding:6px 11px"></button>
    <button class="btn ghost" id="themeBtn" onclick="cycleTheme()" style="font-size:17px;padding:6px 10px"></button>
    <button class="btn ghost" id="btnExport" onclick="exportData()"></button>
    <button class="btn ghost" id="btnImport" onclick="document.getElementById('importFile').click()"></button>
    <button class="btn ghost" id="btnImportMd" onclick="document.getElementById('mdFiles').click()"></button>
    <button class="btn" id="btnSync" onclick="openSync()"></button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
    <input type="file" id="mdFiles" accept=".md,.markdown,.txt" multiple style="display:none" onchange="importMd(this)">
  </div>
</header>
<main id="main"></main>
<datalist id="worldList"></datalist>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ store ============ */
const KEY='storyloom.v1';
let freshVault=false;
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); return Object.assign(blank(), migrate(s)); }
  }catch(e){ console.error('load failed',e); }
  freshVault=true; return blank();
}
// tag pages were called Warps before they gained hierarchy and free text
function migrate(v){ if(v && v.warps && !v.tags){ v.tags=v.warps; delete v.warps; } return v; }
function blank(){ return {notes:[],sequences:[],links:[],tags:[],deleted:{},view:'inbox',openSeq:null,openTag:null,filters:{q:'',world:'',kind:'',tag:''}}; }
// A deletion has to be a fact that travels, not just an absence — otherwise the other
// device still has the item and the merge hands it straight back. tomb() records when
// something died; the merge then drops it everywhere.
function tomb(id){ if(!state.deleted) state.deleted={}; state.deleted[id]=Date.now(); }
let serverMode=false, cloudMode=false, pushTimer=null, suppressSync=false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ // browser quota hit (images) — the disk/cloud vault is the real store
    if(!serverMode&&!cloudMode) toast(t('⚠ Browser storage is full — set up Sync or Export now'));
  }
  if(suppressSync) return;
  if(serverMode){ clearTimeout(pushTimer); pushTimer=setTimeout(pushToServer,700); }
  else if(cloudMode){ clearTimeout(pushTimer); pushTimer=setTimeout(cloudPush,2500); setBadge(t('☁ unsaved…')); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const KINDS=['spark','dialogue','scene','character','place','idea','ref'];

function seed(){
  const s = blank();
  const mk=(text,kind,tags,world)=>({id:uid(),text,kind,tags,world,refs:[],status:'inbox',createdAt:Date.now(),updatedAt:Date.now()});
  const n1=mk('"You keep calling it the end of the world. It\'s only the end of the map."','dialogue',['tone-setter'],'Saltmere');
  const n2=mk('Opening image: a lighthouse that shines darkness instead of light — ships navigate by avoiding its beam.','scene',['opening','visual'],'Saltmere');
  const n3=mk('The cartographer heroine measures coastlines that change nightly. Her maps are only true for one day.','character',['protagonist'],'Saltmere');
  const n4=mk('What if every chapter is one "map-day" — the world literally redraws between chapters?','idea',['structure'],'Saltmere');
  n1.status='sorted'; n2.status='sorted';
  s.notes=[n1,n2,n3,n4];
  s.sequences=[{id:uid(),title:'Saltmere — Act I sketch',description:'First weave: the dark lighthouse cold-open into the cartographer intro.',bgUrl:'',world:'Saltmere',beats:[{noteId:n2.id,time:'Night 0 — cold open'},{noteId:n1.id,time:'Night 0 — first line'}],createdAt:Date.now()}];
  s.links=[{from:n3.id,to:n4.id,label:'structure hangs on her'}];
  s.tags=[{id:uid(),tag:'opening',parent:'',starred:false,title:'Opening',description:'Everything that could serve as a first impression of the world. The one page a stranger judges us by.',image:null,refs:[],createdAt:Date.now(),updatedAt:Date.now()}];
  return s;
}

/* ============ helpers ============ */
const byId = id => state.notes.find(n=>n.id===id);
const seqById = id => state.sequences.find(s=>s.id===id);
const esc = t => (t||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function worlds(){ const w=new Set(); state.notes.forEach(n=>n.world&&w.add(n.world)); state.sequences.forEach(s=>s.world&&w.add(s.world)); return [...w].sort(); }
// Tags are matched case-insensitively everywhere ("Opening" == "opening"), but the
// first spelling seen is kept as the display form.
const norm = t => (t||'').trim().toLowerCase();
function allTags(){
  const m=new Map();
  state.notes.forEach(n=>(n.tags||[]).forEach(x=>{ const k=norm(x); if(k&&!m.has(k)) m.set(k,x.trim()); }));
  return [...m.values()].sort((a,b)=>a.localeCompare(b));
}
function canonTag(t){
  const k=norm(t); if(!k) return '';
  const hit=allTags().find(x=>norm(x)===k);
  return hit||t.trim();
}
function notesWithTag(tag){ const k=norm(tag); return state.notes.filter(n=>(n.tags||[]).some(t=>norm(t)===k)); }
function tagCount(tag){ return notesWithTag(tag).length; }
function tagRec(tag){ const k=norm(tag); return (state.tags||[]).find(w=>norm(w.tag)===k); }
function tagRecById(id){ return (state.tags||[]).find(w=>w.id===id); }
// a page is created only when there is something to save on it
function ensureTagRec(tag){
  let r=tagRec(tag);
  if(!r){ r={id:uid(),tag:canonTag(tag),title:'',description:'',image:null,refs:[],parent:'',starred:false,createdAt:Date.now(),updatedAt:Date.now()};
    state.tags.push(r); }
  return r;
}
// every tag in use, plus any that exist only as a page
function allTagNames(){
  const m=new Map();
  allTags().forEach(t=>m.set(norm(t),t));
  (state.tags||[]).forEach(r=>{ if(!m.has(norm(r.tag))) m.set(norm(r.tag),r.tag); });
  return [...m.values()].sort((a,b)=>a.localeCompare(b));
}
function parentOf(tag){ const r=tagRec(tag); return r&&r.parent?r.parent:''; }
function childTags(tag){ const k=norm(tag); return allTagNames().filter(x=>norm(parentOf(x))===k); }
function descendantTags(tag,seen){
  seen=seen||new Set(); const out=[];
  childTags(tag).forEach(c=>{ const k=norm(c); if(seen.has(k)) return; seen.add(k); out.push(c, ...descendantTags(c,seen)); });
  return out;
}
function rootTags(){ return allTagNames().filter(x=>{ const p=parentOf(x); return !p || !allTagNames().some(y=>norm(y)===norm(p)); }); }
function tagDepth(tag,seen){ const p=parentOf(tag); if(!p) return 0; seen=seen||new Set(); const k=norm(tag);
  if(seen.has(k)) return 0; seen.add(k); return 1+tagDepth(p,seen); }
function seqsOf(noteId){ return state.sequences.filter(s=>s.beats.some(b=>b.noteId===noteId)); }
function linksOf(noteId){ return state.links.filter(l=>l.from===noteId||l.to===noteId); }
function parseTags(str){
  const out=[], seen=new Set();
  (str||'').split(',').map(t=>t.trim()).filter(Boolean).forEach(t=>{
    const c=canonTag(t), k=norm(c);
    if(!seen.has(k)){ seen.add(k); out.push(c); }
  });
  return out;
}
function parseRefs(str){ return (str||'').split(',').map(t=>t.trim()).filter(Boolean); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }

/* ============ render ============ */
function render(){
  save();
  renderNav();
  document.getElementById('worldList').innerHTML = worlds().map(w=>`<option value="${esc(w)}">`).join('');
  const m=document.getElementById('main');
  if(state.view==='inbox') m.innerHTML=viewInbox();
  else if(state.view==='library') m.innerHTML=viewLibrary();
  else if(state.view==='sequences') m.innerHTML = state.openSeq ? viewSeqDetail() : viewSeqList();
  else if(state.view==='tags') m.innerHTML = state.openTag ? viewTagDetail() : viewTagList();
  bindDrag();
}

/* ---- interface language ---------------------------------------------------
   Note *content* always decides its own direction via dir="auto" (so an English
   note reads correctly inside a Hebrew interface). This only switches the chrome. */
const LANGKEY='storyloom.lang';
function lang(){ return localStorage.getItem(LANGKEY)||'en'; }
function t(s){ const d=I18N[lang()]; return (d&&d[s]!==undefined)?d[s]:s; }
function applyLang(){
  const l=lang();
  document.documentElement.lang=l;
  document.documentElement.dir = l==='he' ? 'rtl' : 'ltr';
  const b=document.getElementById('langBtn');
  if(b){ b.textContent = l==='he'?'A':'א'; b.title = l==='he'?'Switch interface to English':'החלף ממשק לעברית'; }
  // the header lives in static markup, so its labels are set here rather than by a template
  [['btnExport','Export','Download everything as JSON'],
   ['btnImport','Import','Restore from a JSON export'],
   ['btnImportMd','Import .md','Import markdown notes from Obsidian or Logseq'],
   ['btnSync','⇅ Sync','Push/pull the vault to a GitHub repo']].forEach(([id,label,tip])=>{
    const el=document.getElementById(id);
    if(el){ el.textContent=t(label); el.title=t(tip); }
  });
  const sb=document.getElementById('storeBadge');
  if(sb) sb.title=t('Where the vault is being saved');
}
function toggleLang(){
  localStorage.setItem(LANGKEY, lang()==='he'?'en':'he');
  applyLang(); render();
}

      <span id="capPreview" class="cap-preview">${pendingImage?`<img src="${pendingImage}" alt=""><button class="btn ghost" onclick="pendingImage=null;showCapPreview()" title="${t('remove image')}">✕</button>`:''}</span>
      <button class="btn primary" onclick="capture()">${t('Add idea')}</button>
    </div>
    <div class="hint">${t("Ctrl+Enter adds instantly. Capture fast, sort later — that's the whole deal.")}</div>

let pendingImage=null;
function pickCapImage(input){
  const f=input.files[0]; input.value='';
  if(!f) return;
  shrinkImage(f).then(d=>{ pendingImage=d; showCapPreview(); toast(t('Image attached 🖼')); })
    .catch(()=>toast(t('Could not read that image')));
}
function showCapPreview(){
  const el=document.getElementById('capPreview');
  if(el) el.innerHTML=pendingImage?`<img src="${pendingImage}" alt=""><button class="btn ghost" onclick="pendingImage=null;showCapPreview()" title="${t('remove image')}">✕</button>`:'';
}
function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const MAX=1400, scale=Math.min(1,MAX/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*scale)); cv.height=Math.max(1,Math.round(img.height*scale));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      let out = file.type==='image/png' ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',.85);
      if(out.length>2000000) out=cv.toDataURL('image/jpeg',.8);
      URL.revokeObjectURL(url); resolve(out);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('unreadable image')); };
    img.src=url;
  });
}
function capture(){
  const txt=document.getElementById('capText').value.trim();

    world:document.getElementById('capWorld').value.trim(),tags:parseTags(document.getElementById('capTags').value),
    refs:[],image:pendingImage||null,status:'inbox',createdAt:Date.now(),updatedAt:Date.now()});
  pendingImage=null;
  render(); toast(t('Spark saved ✦'));
  const el=document.getElementById('capText'); if(el) el.focus();
}

function moveBeat(sid,i,d){ const s=seqById(sid); const j=i+d; if(!s||j<0||j>=s.beats.length) return; [s.beats[i],s.beats[j]]=[s.beats[j],s.beats[i]]; s.updatedAt=Date.now(); render(); }
function rmBeat(sid,i){ const s=seqById(sid); if(s){ s.beats.splice(i,1); s.updatedAt=Date.now(); render(); } }

let dragIdx=null;
function bindDrag(){
  const wrap=document.getElementById('beats'); if(!wrap) return;
  wrap.querySelectorAll('.beat').forEach(el=>{
    el.addEventListener('dragstart',e=>{ dragIdx=+el.dataset.i; e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
    el.addEventListener('drop',e=>{
      e.preventDefault(); el.classList.remove('dragover');
      const to=+el.dataset.i, s=seqById(state.openSeq);
      if(s&&dragIdx!==null&&dragIdx!==to){ const [m]=s.beats.splice(dragIdx,1); s.beats.splice(to,0,m); s.updatedAt=Date.now(); render(); }
      dragIdx=null;
    });
  });
}

function tagRow(tag,depth,seen){

const SYNCKEY='storyloom.sync';
function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNCKEY))||{}; }catch(e){ return {}; } }
function saveSyncCfg(c){ localStorage.setItem(SYNCKEY, JSON.stringify(c)); }
function openSync(){

    <div class="frow"><div style="flex:2"><span class="flabel">${t('repository (owner/name)')}</span><input id="syRepo" placeholder="your-username/storyloom-vault" value="${esc(c.repo||'')}"></div>

    <p style="font-size:12px;color:var(--ink-faint)">The token stays in this browser only — it is never written into the vault file, an export, or the page itself. Each browser you use needs it entered once.</p>
    <div id="syStatus" style="font-size:13px;color:var(--accent3);min-height:18px;margin-top:6px">${serverMode?'This device is running server.js, so the vault saves to disk here. Sync copies it to GitHub as well.':(cloudMode?'Auto-sync is ON — changes save to GitHub a couple of seconds after you stop typing.':'Enter a repo and token, then Connect to turn on auto-sync.')}</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${t('Close')}</button>
      <span style="flex:1"></span>
      <button class="btn" onclick="ghPull()" title="${t("Replace this device's vault with the GitHub copy")}">${t('⇣ Pull')}</button>
      ${serverMode?'':`<button class="btn" onclick="connectCloud()" title="${t('Turn on automatic syncing')}">${t('⟳ Connect')}</button>`}
      <button class="btn primary" onclick="ghPush()" title="${t("Upload this device's vault to GitHub now")}">${t('⇡ Push')}</button>
    </div></div>`;
  document.body.appendChild(div);

function readSyncForm(){
  const c={repo:document.getElementById('syRepo').value.trim(),
    branch:document.getElementById('syBranch').value.trim()||'main',
    path:document.getElementById('syPath').value.trim()||'vault.json',
    token:document.getElementById('syTok').value.trim(),
    sha:syncCfg().sha};
  saveSyncCfg(c); return c;
}
async function connectCloud(){
  const c=readSyncForm();
  if(!c.repo||!c.token){ syStatus(t('Repository and token are required.'),1); return; }
  syStatus(t('Connecting…'));
  const r=await fetch(`${ghUrl(c)}?ref=${encodeURIComponent(c.branch||'main')}`,{headers:ghHeaders(c),cache:'no-store'}).catch(()=>null);
  if(!r){ syStatus(t('Network error reaching GitHub.'),1); return; }
  if(r.status===401||r.status===403){ syStatus(t('GitHub rejected the token — check it has Contents: read & write on that repo.'),1); return; }
  if(r.status!==200&&r.status!==404){ syStatus(`GitHub said ${r.status} — check owner/repo and branch.`,1); return; }
  if(!cloudMode){ cloudMode=true; startCloudWatch(); }
  syStatus(t('Connected ✓ auto-sync is on.'));
  closeModal();
  await cloudPull(false);
  if(r.status===404) cloudPush();
  toast(t('☁ Auto-sync connected'));
}
function syStatus(msg,err){ const el=document.getElementById('syStatus'); if(el){ el.textContent=msg; el.style.color=err?'var(--danger)':'var(--accent3)'; } }
function ghHeaders(c){ return {'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; }
function b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192)); return btoa(bin); }
function b64dec(b64){ const bin=atob(b64.replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0))); }
async function ghPull(){
  const c=readSyncForm();
  if(!c.repo||!c.token){ syStatus(t('Repository and token are required.'),1); return; }
  syStatus('Pulling…');
  try{
    const g=await ghRead(c);
    if(g.status===404){ syStatus(t('No vault file in that repo yet — Push first to create it.'),1); return; }
    if(!g.ok){ syStatus(t('GitHub rejected that request — check repo name, branch, and token.'),1); return; }
    const j={sha:g.sha};
    const incoming=JSON.parse(g.text);
    if(!Array.isArray(incoming.notes)||!Array.isArray(incoming.sequences)) throw new Error('file is not a Storyloom vault');
    if(!confirm(`Replace this device's vault with the GitHub copy?\n(${incoming.notes.length} notes, ${incoming.sequences.length} sequences)`)){ syStatus('Pull cancelled.'); return; }
    c.sha=j.sha; saveSyncCfg(c);
    state=Object.assign(blank(),incoming);
    closeModal(); render(); toast(t('Pulled from GitHub ⇣'));
  }catch(e){ syStatus('Pull failed: '+e.message,1); }
}
async function ghPush(){
  const c=readSyncForm();
  if(!c.repo||!c.token){ syStatus(t('Repository and token are required.'),1); return; }
  syStatus('Pushing…');
  try{
    if(!c.sha){
      const r0=await fetch(`https://api.github.com/repos/${c.repo}/contents/${c.path}?ref=${encodeURIComponent(c.branch)}`,{headers:ghHeaders(c)});
      if(r0.ok){ c.sha=(await r0.json()).sha; }
    }
    const body={message:'storyloom vault '+new Date().toISOString(),content:b64enc(JSON.stringify(stripUi(state),null,2)),branch:c.branch};
    if(c.sha) body.sha=c.sha;
    const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${c.path}`,{method:'PUT',headers:ghHeaders(c),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){ syStatus('GitHub has newer changes (probably from the other of you) — Pull first, then Push again.',1); return; }
    if(!r.ok){ syStatus(`GitHub said ${r.status} — check repo name, branch, and token.`,1); return; }
    const j=await r.json(); c.sha=j.content.sha; saveSyncCfg(c);
    syStatus('Pushed ✓ — the vault is on GitHub.'); toast(t('Pushed to GitHub ⇡'));
  }catch(e){ syStatus('Push failed: '+e.message,1); }
}

/* ---- Obsidian / Logseq markdown import ---- */
function parseMd(name,text){
  const tags=new Set(); let body=text.replace(/\r\n/g,'\n');
  const fm=body.match(/^---\n([\s\S]*?)\n---\n?/);
  if(fm){
    body=body.slice(fm[0].length);
    const inline=fm[1].match(/^tags:[ \t]*\[?([^\n\[]+?)\]?[ \t]*$/m);
    if(inline) inline[1].split(',').forEach(t=>{ t=t.replace(/["'#]/g,'').trim(); if(t)tags.add(t); });
    const list=fm[1].match(/^tags:[ \t]*\n((?:[ \t]*-[^\n]*\n?)+)/m);
    if(list) [...list[1].matchAll(/-[ \t]*(.+)/g)].forEach(m=>{ const t=m[1].replace(/["'#]/g,'').trim(); if(t)tags.add(t); });
  }
  body=body.replace(/^[ \t]*-?[ \t]*([\w-]+)::[ \t]*(.*)$/gm,(all,k,v)=>{
    if(k.toLowerCase()==='tags') v.split(',').forEach(t=>{ t=t.replace(/[#\[\]]/g,'').trim(); if(t)tags.add(t); });
    return '';
  });
  [...body.matchAll(/(?:^|[\s(])#([A-Za-z][\w/-]*)/gm)].forEach(m=>tags.add(m[1]));
  const wikis=[...body.matchAll(/\[\[([^\]|]+)(?:\|[^\]]*)?\]\]/g)].map(m=>m[1].trim()).filter(Boolean);
  const title=name.replace(/\.(md|markdown|txt)$/i,'').trim();
  return {title,body:body.trim(),tags:[...tags].filter(Boolean),wikis};
}
function importMd(input){
  const files=[...input.files]; input.value='';
  if(!files.length) return;
  Promise.all(files.map(f=>f.text().then(text=>({name:f.name,text}))))
  .then(items=>{
    const world=(prompt(t('Assign the imported notes to a world/project? (leave blank for none)'))||'').trim();
    const made=[], titleMap={};
    state.notes.forEach(n=>{ const t=n.text.split('\n')[0].trim().toLowerCase(); if(t&&!(t in titleMap)) titleMap[t]=n.id; });
    items.forEach(it=>{
      const p=parseMd(it.name,it.text);
      if(!p.title&&!p.body) return;
      const n={id:uid(),text:p.title+(p.body?'\n\n'+p.body:''),kind:'idea',world,
        tags:p.tags,refs:[],status:'inbox',createdAt:Date.now(),updatedAt:Date.now()};
      state.notes.unshift(n); made.push({note:n,wikis:p.wikis});
      titleMap[p.title.toLowerCase()]=n.id;
    });
    let linkCount=0;
    made.forEach(m=>m.wikis.forEach(w=>{
      const to=titleMap[w.toLowerCase()];
      if(to&&to!==m.note.id&&!state.links.some(l=>(l.from===m.note.id&&l.to===to)||(l.from===to&&l.to===m.note.id))){
        state.links.push({from:m.note.id,to,label:'wikilink'}); linkCount++;
      }
    }));
    state.view='inbox'; render();
    toast(`Imported ${made.length} note${made.length===1?'':'s'}${linkCount?` + ${linkCount} wikilink${linkCount===1?'':'s'}`:''} ✦`);
  });
}

/* ---- disk persistence (via server.js /api/vault) ---- */
function setBadge(txt,err){
  const el=document.getElementById('storeBadge');
  if(el){ el.textContent=txt; el.style.color=err?'var(--danger)':'var(--ink-faint)'; }
}
async function pushToServer(){
  try{
    const r=await fetch('/api/vault',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    setBadge(r.ok?'⛁ vault.json ✓':'⛁ disk save failed', !r.ok);
  }catch(e){ setBadge(t('⛁ disk save failed'),true); }
}
function mergeVaults(local,remote){
  const out=blank();
  out.view=local.view; out.filters=local.filters; out.openSeq=local.openSeq; out.openTag=local.openTag;
  out.deleted=Object.assign({},remote.deleted||{});
  Object.entries(local.deleted||{}).forEach(([k,t])=>{ if(!out.deleted[k]||t>out.deleted[k]) out.deleted[k]=t; });
  const wm=new Map();
  ((remote.tags||remote.warps)||[]).forEach(w=>wm.set(norm(w.tag),w));
  ((local.tags||local.warps)||[]).forEach(w=>{ const k=norm(w.tag), ex=wm.get(k); if(!ex||(w.updatedAt||0)>=(ex.updatedAt||0)) wm.set(k,w); });
  out.tags=[...wm.values()];
  const nm=new Map();
  (remote.notes||[]).forEach(n=>nm.set(n.id,n));
  (local.notes||[]).forEach(n=>{ const ex=nm.get(n.id); if(!ex||(n.updatedAt||0)>=(ex.updatedAt||0)) nm.set(n.id,n); });
  out.notes=[...nm.values()].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const sm=new Map();
  (remote.sequences||[]).forEach(s=>sm.set(s.id,s));
  (local.sequences||[]).forEach(s=>{ const ex=sm.get(s.id); if(!ex||(s.updatedAt||0)>=(ex.updatedAt||0)) sm.set(s.id,s); });
  out.sequences=[...sm.values()];
  const seen=new Set();
  out.links=[...(remote.links||[]),...(local.links||[])].filter(l=>{
    const k=[l.from,l.to].sort().join('|');
    if(seen.has(k)) return false; seen.add(k); return true;
  });
  return applyTombstones(dedupeByText(out));
}
// Anything whose tombstone is newer than its last edit is gone for good — on every
// device, at the next sync. An edit made *after* the deletion wins instead, so
// "I deleted it, then you kept working on it" keeps the work.
function applyTombstones(v){
  const d=v.deleted||{};
  const dead=o=>d[o.id]!==undefined && d[o.id]>=(o.updatedAt||0);
  v.notes=(v.notes||[]).filter(n=>!dead(n));
  v.sequences=(v.sequences||[]).filter(s=>!dead(s));
  v.tags=(v.tags||[]).filter(w=>!dead(w));
  const alive=new Set(v.notes.map(n=>n.id));
  v.sequences.forEach(s=>{ s.beats=(s.beats||[]).filter(b=>alive.has(b.noteId)); });
  v.links=(v.links||[]).filter(l=>alive.has(l.from)&&alive.has(l.to));
  // forget very old tombstones so the vault does not grow forever; by then every
  // device has long since synced the deletion
  const cutoff=Date.now()-180*24*3600*1000;
  Object.keys(d).forEach(k=>{ if(d[k]<cutoff) delete d[k]; });
  return v;
}
// Two devices can hold the same note under different ids (e.g. both got the demo
// seed, or the same file was imported twice). Collapse exact-text duplicates and
// remap sequences/links onto the surviving note.
function dedupeByText(v){
  const referenced=new Set();
  v.sequences.forEach(s=>s.beats.forEach(b=>referenced.add(b.noteId)));
  const keep=new Map(), remap={};
  v.notes.slice()
    .sort((a,b)=>(referenced.has(a.id)?0:1)-(referenced.has(b.id)?0:1)||(a.createdAt||0)-(b.createdAt||0))
    .forEach(n=>{
      const k=n.text.trim()+'|'+(n.image?(n.image.length+n.image.slice(-40)):'');
      const ex=keep.get(k);
      if(!ex) keep.set(k,n); else remap[n.id]=ex.id;
    });
  if(!Object.keys(remap).length) return v;
  v.notes=v.notes.filter(n=>!(n.id in remap));
  v.sequences.forEach(s=>{
    s.beats.forEach(b=>{ if(remap[b.noteId]) b.noteId=remap[b.noteId]; });
    const sb=new Set(); s.beats=s.beats.filter(b=>{ if(sb.has(b.noteId)) return false; sb.add(b.noteId); return true; });
  });
  v.links=v.links.map(l=>({from:remap[l.from]||l.from,to:remap[l.to]||l.to,label:l.label})).filter(l=>l.from!==l.to);
  const sl=new Set();
  v.links=v.links.filter(l=>{ const k=[l.from,l.to].sort().join('|'); if(sl.has(k)) return false; sl.add(k); return true; });
  return v;
}
async function initStorage(){
  // 1) Is server.js behind this page? Its own header proves it, so a static host's
  //    404 page is never mistaken for "our API, vault not created yet". Only worth
  //    asking when served from a local machine — GitHub Pages never has an API.
  const maybeLocal=/^(localhost|127\.0\.0\.1|\[::1\]|.*\.local)$/i.test(location.hostname);
  try{
    if(!maybeLocal) throw new Error('static host');
    const r=await fetch('/api/vault',{cache:'no-store'});
    if(r.headers.get('X-Storyloom')){
      serverMode=true;
      if(r.ok){
        const remote=await r.json();
        if(remote&&Array.isArray(remote.notes)) state=mergeVaults(state,migrate(remote));
      }else if(freshVault){ state=seed(); }
      render(); pushToServer();
      return;
    }
  }catch(e){ /* file:// or offline — fall through */ }

  // 2) No local server: GitHub becomes the vault if sync is configured.
  const c=syncCfg();
  if(c.repo&&c.token){
    cloudMode=true;
    startCloudWatch();
    await cloudPull(true);
    return;
  }

  // 3) Neither — this browser only.
  if(freshVault){ state=seed(); render(); }
  setBadge(t('⛁ this browser only'));
}

/* ---- automatic GitHub sync (used when hosted on Pages / any static host) ---- */
function ghUrl(c){ return `https://api.github.com/repos/${c.repo}/contents/${c.path||'vault.json'}`; }
// GitHub only inlines base64 for files up to 1MB; past that "content" comes back
// empty and the raw media type is the only way to read it. Vaults cross 1MB as
// soon as a few images go in, so both paths are handled.
async function ghRead(c){
  const url=`${ghUrl(c)}?ref=${encodeURIComponent(c.branch||'main')}`;
  const r=await fetch(url,{headers:ghHeaders(c),cache:'no-store'});
  if(!r.ok) return {ok:false,status:r.status};
  const j=await r.json();
  if(j.content&&j.content.length) return {ok:true,sha:j.sha,text:b64dec(j.content)};
  const raw=await fetch(url,{headers:Object.assign({},ghHeaders(c),{Accept:'application/vnd.github.raw'}),cache:'no-store'});
  if(!raw.ok) return {ok:false,status:raw.status};
  return {ok:true,sha:j.sha,text:await raw.text()};
}
async function cloudPull(silent){
  const c=syncCfg();
  if(!cloudMode||!c.repo||!c.token) return;
  try{
    const g=await ghRead(c);
    if(g.status===404){ setBadge(t('☁ new vault — saving…')); if(freshVault){ state=seed(); suppressRender(); } cloudPush(); return; }
    if(!g.ok){ setBadge(t('☁ cannot reach GitHub'),true); return; }
    const j={sha:g.sha};
    if(j.sha!==c.sha){
      const remote=migrate(JSON.parse(g.text));
      if(remote&&Array.isArray(remote.notes)){
        const before=JSON.stringify({n:state.notes,s:state.sequences,w:state.tags,l:state.links});
        state=mergeVaults(state,remote);
        c.sha=j.sha; saveSyncCfg(c);
        suppressRender();
        const after=JSON.stringify({n:state.notes,s:state.sequences,w:state.tags,l:state.links});
        // our copy contributed something the remote lacked → send it back up
        if(after!==JSON.stringify({n:remote.notes,s:remote.sequences,w:remote.tags||[],l:remote.links})) cloudPush();
        else setBadge(t('☁ synced ✓'));
        if(!silent&&before!==after) toast(t('Pulled changes ⇣'));
        return;
      }
    }
    setBadge(t('☁ synced ✓'));
  }catch(e){ setBadge('☁ cannot reach GitHub',true); }
}
function suppressRender(){ suppressSync=true; render(); suppressSync=false; }
async function cloudPush(){
  const c=syncCfg();
  if(!cloudMode||!c.repo||!c.token) return;
  clearTimeout(pushTimer);
  setBadge(t('☁ saving…'));
  try{
    // read-modify-write: fold in anything the other person pushed since our last sync
    let sha=null;
    const g=await ghRead(c);
    if(g.ok){
      sha=g.sha;
      if(sha!==c.sha){
        const remote=migrate(JSON.parse(g.text));
        if(remote&&Array.isArray(remote.notes)){ state=mergeVaults(state,remote); suppressRender(); }
      }
    }else if(g.status!==404){ throw new Error('GET '+g.status); }
    const body={message:'storyloom vault '+new Date().toISOString(),
      content:b64enc(JSON.stringify(stripUi(state),null,2)),branch:c.branch||'main'};
    if(sha) body.sha=sha;
    const p=await fetch(ghUrl(c),{method:'PUT',headers:ghHeaders(c),body:JSON.stringify(body)});
    if(!p.ok) throw new Error('PUT '+p.status);
    const j2=await p.json(); c.sha=j2.content.sha; saveSyncCfg(c);
    setBadge(t('☁ synced ✓'));
  }catch(e){
    setBadge(t('☁ not saved — retrying'),true);
    clearTimeout(pushTimer); pushTimer=setTimeout(cloudPush,15000);
  }
}
// which tab/filter you're looking at is yours alone — never sync it
function stripUi(s){ const o=Object.assign({},s); delete o.view; delete o.openSeq; delete o.openTag; delete o.filters; return o; }
function startCloudWatch(){
  setInterval(()=>{ if(document.visibilityState==='visible') cloudPull(true); },45000);
  window.addEventListener('focus',()=>cloudPull(true));
  window.addEventListener('beforeunload',e=>{
    if(pushTimer&&cloudMode){ e.preventDefault(); e.returnValue=''; }
  });
}

/* ---- theme ---- */
const THEMEKEY='storyloom.theme';
function themePref(){ return localStorage.getItem(THEMEKEY)||'auto'; }
function applyTheme(){
  const p=themePref();
  if(p==='auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=p;
  const b=document.getElementById('themeBtn');
  if(b){ b.textContent = p==='auto'?'◐':(p==='light'?'☀':'☾'); b.title='Theme: '+p+' — click to switch'; }
}
function cycleTheme(){
  const order=['auto','light','dark'];
  localStorage.setItem(THEMEKEY, order[(order.indexOf(themePref())+1)%3]);
  applyTheme();
}

function clearFilters(){ state.filters={q:'',world:'',kind:'',tag:''}; render(); }

render();
applyTheme();
applyLang();
initStorage();
</script>
